<ul>
  @for (item of modes; track item.name) {
    <li><button (click)="redirectTo(item.route)">{{ item.icon }} {{ item.name }}</button></li>
  }
</ul>
<ul>
  @for (workout of workoutList(); track workout.name) {
    <li (click)="chooseWorkout(workout.name)">{{ workout.icon }} {{ workout.name }}</li>
  }
</ul>
