<ul class="view-list">
  @for (mode of modes; track mode.name) {
    <li [class]="{'active': mode.name===activeModeName() }" (click)="redirectTo(mode)">{{ mode.icon }} {{ mode.name }}</li>
  }
</ul>
<ul class="session-list">
  @for (workout of workoutList(); track workout.name) {
    <li [class]="{'active': workout.name===selectedWorkoutName()}" (click)="chooseWorkout(workout.name)">{{ workout.icon }} {{ workout.name }}</li>
  }
</ul>
